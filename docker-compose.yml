
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-backend-pg
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ragdb
      PG_USER: raguser
      PG_PASSWORD: ${PG_PASSWORD}
      DATA_DIR: /app/data
    ports:
      - "8000:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rag-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend-pg
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
    ports:
      - "8502:8080"
    depends_on:
      - backend
    networks:
      - rag-network

volumes:
  postgres_data:
    external: true
    name: 261249d763c1fcbac7422d6d5ab69f8876f5dae5aa908410e342eb2e0f681d02

networks:
  rag-network:
    external: true
    name: rag-network
